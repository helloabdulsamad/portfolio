server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # /about serves about.html. Pages always check for a newer copy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }

  # Next build files have a hash in their name, so they never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images, fonts and scripts: cache for an hour.
  location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico|woff2?|ttf|mp4)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # The social preview image has no file extension.
  location = /opengraph-image {
    default_type image/png;
  }

  error_page 404 /404.html;
}
